<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
    <style>
        table#primera {
            background: lavender;
            border: 1px black solid;
            border-collapse: collapse;
            font: 1.1rem 'Segoe UI', sans-serif;
        }
        #primera td {
            padding: 3px 20px;
            border-bottom: 1px solid red;
        }

        #primera th {
            background: #333;
            color: white;
            padding: 8px 20px;
        }

        #primera td:nth-child(2) {
            text-align: center;
        }

        #primera tr:nth-child(even) {
            background: #ddd;
        }
    * {
        box-sizing: border-box;
    }
    </style>
</head>
