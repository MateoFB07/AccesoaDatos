<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Gestión - Acceso a Datos</title>
    <style>
        /* Hace que el ancho y el alto incluyan el padding y los bordes. */
        * {
            box-sizing: border-box;
        }

        /* Define la tipografía, el fondo y el espacio exterior de la página. */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }

        /* Centra y limita el ancho del bloque que contiene el título. */
        .header-titulo {
            width: 100%;
            max-width: 850px;
            margin: 0 auto 15px auto;
            padding: 10px;
            background: #fff;
            border: 1px solid #ccc;
            text-align: center;
        }

        /* Ajusta el tamaño y el color del encabezado principal. */
        .header-titulo h1 {
            font-size: 1.5rem;
            color: #333;
        }

        /* Da formato a la barra superior y distribuye sus elementos en horizontal. */
        .barra-superior {
            width: 100%;
            max-width: 850px;
            margin: 0 auto 20px auto;
            padding: 10px 15px;
            background: #e9ecef;
            border: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Centra el formulario, limita su ancho y define su fondo y espaciado. */
        form {
            width: 100%;
            max-width: 850px;
            margin: auto;
            padding: 25px;
            background: #f5f5f5;
            border: 1px solid #eee;
        }

        /* Organiza el formulario en una columna principal y otra secundaria. */
        .contenido-formulario {
            display: grid;
            grid-template-columns: 7fr 3fr;
            gap: 12px;
            align-items: start;
        }

        /* Hace que la tabla ocupe todo el ancho y separa sus columnas. */
        table {
            width: 100%;
            border-spacing: 12px 0;
        }

        /* Coloca las celdas de cada fila en una cuadrícula con separación. */
        tr {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }


        /* Permite que las celdas se ajusten al espacio disponible. */
        td {
            min-width: 0;
            padding: 0;
            vertical-align: top;
        }

        /* Presenta las etiquetas como bloques legibles sobre los campos. */
        td > label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Da el mismo ancho y un formato uniforme a campos, listas y áreas de texto. */
        td > input:not([type="checkbox"]),
        td > select,
        td > textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        /* Alinea a la derecha el contenido de la fila de acciones. */
        tr.acciones td {
            text-align: right;
        }

        /* Da formato a la etiqueta asociada a la columna de imagen. */
        .columna-imagen > label {
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Crea un recuadro flexible y centrado para mostrar la imagen. */
        .contenedor-imagen {
            border: 2px dashed #bbb;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            margin-bottom: 10px;
        }

        /* Limita el tamaño de la imagen y conserva sus proporciones dentro del recuadro. */
        .contenedor-imagen img {
           max-width: 100%;
        max-height: 200px;
        object-fit: contain;
        display: block;
        }

        /* Da formato común al botón de envío y a los botones normales. */
        input[type="submit"], button {
            border: none;
            background-color: forestgreen;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            padding: 8px 18px;
            border-radius: 3px;
        }

        /* Cambia el color y añade una sombra al pasar el puntero por los botones. */
        input[type="submit"]:hover, button:hover {
            background-color: rgb(74, 216, 74);
            box-shadow: 0 3px 4px rgba(195, 194, 194, 0.932);
        }

    </style>
</head>
<body>

    <!-- 1. Cuadro de título superior (Boceto Pizarra) -->
    <div class="header-titulo">
        <h1>Módulo de Acceso a Datos - Registro</h1>
    </div>

    <!-- 3. Formulario principal -->
    <form id="miFormulario" action="http://www.cursos-diseño.es/mostrar.php" method="post" enctype="multipart/form-data">
        <div class="contenido-formulario">
            <table>
                <tbody>
                    <tr>
                        <td>
                            <label for="codigo">Código / ID:</label>
                            <input type="text" name="codigo" id="codigo" required placeholder="Ej: REG-001">
                        </td>
                        <td>
                            <label for="nombre">Nombre:</label>
                            <input type="text" name="nombre" id="nombre" required placeholder="Nombre">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="categoria">Categoría:</label>
                            <select name="categoria" id="categoria">
                                <option value="General">General</option>
                                <option value="Equipamiento">Equipamiento</option>
                                <option value="Servicios">Servicios</option>
                            </select>
                        </td>
                        <td>
                            <label for="precio">Precio (€):</label>
                            <input type="number" name="precio" id="precio" min="0" step="0.01" placeholder="0.00">
                        </td>
                    </tr>
                    <tr class="fila-completa">
                        <td>
                            <label for="observaciones">Observaciones:</label>
                            <input type="text" name="observaciones" id="observaciones" placeholder="Detalles o descripción...">
                        </td>
                    </tr>
                    <tr class="fila-completa">
                        <td>
                            <label>
                            <input type="checkbox" name="acepto" value="si" required>
                            <strong>Acepto <a href="terminos-y-condiciones.html">los términos y condiciones</a></strong>
                        </label>
                        </td>
                    </tr>
                    <tr class="acciones">
                        <td>
                            <input type="submit" value="Guardar Registro">
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="contenedor-imagen">
             <img src="pruebas/madrid6.jpg" alt="Foto de Madrid">
            </div>
    </form>
</body>
</html>
